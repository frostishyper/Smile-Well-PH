<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Log-In</title>
        <link rel="stylesheet" href="../CSS/all.min.css">
        <link rel="stylesheet" href="../CSS/index.css">
    </head>

    <body>
        <div class="LoginFormContainer">
            <div class="LoginLogoContainer">
                <h1 class="SmileWellLogo">
                <span class="logo-light">Smile</span><span class="logo-dark">Well</span>
                <br>
                <span class="logo-light">Dental System</span>
                </h1>
            </div>
            <div class="LoginFormHeader">
                <h1 class="HeaderText">Welcome back, Dentist!</h1>
                <h2 class="SubHeaderText">Login With Your Credentials To Access Smile Well Dental Management System</h2>
            </div>
            <div class="LoginForm">
                <div class="LoginInputContainer">
                    <h1 class="Input-Label">
                        <span>Username</span><span class="required-field"> *</span>
                    </h1>
                    <input type="text" id="Username" class="Input-Field" placeholder="Enter Username">
                </div>
                <div class="LoginInputContainer">
                    <h1 class="Input-Label">
                        <span>Username</span><span class="required-field"> *</span>
                    </h1>
                    <input type="text" id="Password" class="Input-Field" placeholder="Enter Password">
                </div>
                <button class="Login-BTN" id="Login-BTN">Login</button>
            </div>
        </div>
        <div class="LoginBannerContainer">
            <div class="Banner"></div>
        </div>
    </body>

    <div class="portrait-warning">
    <i class="fa-solid fa-tablet-screen-button"></i>
    <h2>Please rotate your device</h2>
    <p>SmileWell Dental System requires landscape mode.</p>
    </div>

</html>
