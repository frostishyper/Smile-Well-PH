<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Staff - SmileWell Dental System</title>
        <link rel="stylesheet" href="../CSS/staff-list.css">
    </head>
    <body>
        <div class="portrait-warning">
            <h2>Please rotate your device</h2>
            <p>SmileWell Dental System requires landscape mode.</p>
        </div>

        <div class="SideBar">
            <div class="TopCorner">
                <div class="LogoContainer">
                    <h1 class="SmileWellLogo">
                        <span class="logo-light">Smile</span><span class="logo-dark">Well</span>
                        <br>
                        <span class="logo-light">Dental </span><span class="logo-dark">System</span>
                    </h1>
                </div>
            </div>

            <div class="Side-Nav-Container">
                <div class="Side-Nav-BTN" id="dashboardpage-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M20.8333 6.25H6.25V20.8333H20.8333V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M43.75 6.25H29.1667V20.8333H43.75V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M43.75 29.1667H29.1667V43.75H43.75V29.1667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20.8333 29.1667H6.25V43.75H20.8333V29.1667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Dashboard</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN" id="recordspage-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M43.75 16.6667V43.75H6.25V16.6667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M47.9167 6.25H2.08333V16.6667H47.9167V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20.8333 25H29.1667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Records</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN" id="appointmentspage-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M39.5833 8.33333H10.4167C8.11548 8.33333 6.25 10.1988 6.25 12.5V41.6667C6.25 43.9679 8.11548 45.8333 10.4167 45.8333H39.5833C41.8845 45.8333 43.75 43.9679 43.75 41.6667V12.5C43.75 10.1988 41.8845 8.33333 39.5833 8.33333Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M33.3333 4.16667V12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M16.6667 4.16667V12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M6.25 20.8333H43.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Appointments</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN" id="newpatientpage-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M33.3333 43.75V39.5833C33.3333 37.3732 32.4554 35.2536 30.8926 33.6908C29.3298 32.128 27.2101 31.25 25 31.25H10.4167C8.20653 31.25 6.08691 32.128 4.52411 33.6908C2.96131 35.2536 2.08333 37.3732 2.08333 39.5833V43.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M17.7083 22.9167C22.3107 22.9167 26.0417 19.1857 26.0417 14.5833C26.0417 9.98096 22.3107 6.25 17.7083 6.25C13.106 6.25 9.375 9.98096 9.375 14.5833C9.375 19.1857 13.106 22.9167 17.7083 22.9167Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M41.6667 16.6667V29.1667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M47.9167 22.9167H35.4167" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">New Patient</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN active" id="staffpage-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M33.3333 8.33333H37.5C38.6051 8.33333 39.6649 8.77232 40.4463 9.55372C41.2277 10.3351 41.6667 11.3949 41.6667 12.5V41.6667C41.6667 42.7717 41.2277 43.8315 40.4463 44.6129C39.6649 45.3943 38.6051 45.8333 37.5 45.8333H12.5C11.3949 45.8333 10.3351 45.3943 9.55372 44.6129C8.77232 43.8315 8.33333 42.7717 8.33333 41.6667V12.5C8.33333 11.3949 8.77232 10.3351 9.55372 9.55372C10.3351 8.77232 11.3949 8.33333 12.5 8.33333H16.6667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M31.25 4.16667H18.75C17.5994 4.16667 16.6667 5.09941 16.6667 6.25V10.4167C16.6667 11.5673 17.5994 12.5 18.75 12.5H31.25C32.4006 12.5 33.3333 11.5673 33.3333 10.4167V6.25C33.3333 5.09941 32.4006 4.16667 31.25 4.16667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Staff</h1>
                    </div>
                </div>
            </div>

            <div class="Logout-Container">
                <div class="Logout-BTN" id="logout-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M39.5161 5.36706C45.8669 9.83134 50 17.1329 50 25.3968C50 38.9682 38.8306 49.9702 25.0504 49.9999C11.2903 50.0297 0.0201797 38.9881 1.83988e-05 25.4365C-0.0100622 17.1726 4.123 9.85118 10.4637 5.37698C11.6432 4.55357 13.2863 4.90079 13.9919 6.14087L15.5847 8.92856C16.1794 9.97023 15.8972 11.2897 14.9194 12.004C10.7359 15.0595 8.06453 19.9008 8.06453 25.3869C8.05445 34.5436 15.5746 42.0634 25 42.0634C34.2339 42.0634 41.996 34.7023 41.9355 25.2877C41.9052 20.1488 39.4456 15.1885 35.0706 11.994C34.0927 11.2797 33.8206 9.96031 34.4153 8.92856L36.0081 6.14087C36.7137 4.91071 38.3468 4.54365 39.5161 5.36706ZM29.0323 26.1904V2.38095C29.0323 1.06151 27.9536 0 26.6129 0H23.3871C22.0464 0 20.9678 1.06151 20.9678 2.38095V26.1904C20.9678 27.5099 22.0464 28.5714 23.3871 28.5714H26.6129C27.9536 28.5714 29.0323 27.5099 29.0323 26.1904Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="Logout-Label">Logout</h1>
                    </div>
                </div>
            </div>
        </div>

        <div class="MainView">
            <div class="TopBar">
                <div class="TopBar-Nav">
                    <h1 class="TopBar-Nav-Text">Staff</h1>
                </div>
                <div class="UserContainer">
                    <div class="Username-Container">
                        <h1 class="Staff-Name" id="staff-name">Frostishyper</h1>
                        <h2 class="Staff-Role" id="staff-role">Dentist</h2>
                    </div>
                    <div class="PFP-Container">
                        <div class="PFP" id="staff-pfp"></div>
                    </div>
                </div>
            </div>

            <main class="MainActivity">
                <section class="staff-list-shell" aria-labelledby="staff-list-heading">
                    <div class="staff-list-toolbar">
                        <div class="staff-list-search">
                            <label class="staff-list-search-label" for="staff-list-search-input">
                                <svg class="staff-list-search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                                    <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                                    <path d="M20 20L16.5 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                </svg>
                                <span class="sr-only">Search staff</span>
                            </label>
                            <input class="staff-list-search-input" id="staff-list-search-input" name="search" type="text" placeholder="Search..." autocomplete="off">
                        </div>

                        <button class="staff-list-new-btn" id="staff-list-new-btn" type="button">
                            <span class="staff-list-new-text">New</span>
                            <svg class="staff-list-new-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                                <path d="M12 5V19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                                <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            </svg>
                        </button>

                        <div class="staff-list-sort" id="staff-list-sort">
                            <button class="staff-list-sort-toggle" id="staff-list-sort-toggle" type="button" aria-haspopup="listbox" aria-expanded="false">
                                <span class="staff-list-sort-text" id="staff-list-sort-text">Sort</span>
                                <svg class="staff-list-sort-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                    <path d="M12.5 18.75L25 31.25L37.5 18.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <div class="staff-list-sort-menu" id="staff-list-sort-menu" role="listbox" aria-label="Sort staff list" hidden>
                                <button class="staff-list-sort-option" type="button" data-sort-label="Dentist ID Ascending">Dentist ID Ascending</button>
                                <button class="staff-list-sort-option" type="button" data-sort-label="Dentist ID Descending">Dentist ID Descending</button>
                                <button class="staff-list-sort-option" type="button" data-sort-label="Name Ascending">Name Ascending</button>
                                <button class="staff-list-sort-option" type="button" data-sort-label="Name Descending">Name Descending</button>
                                <button class="staff-list-sort-option" type="button" data-sort-label="Role Ascending">Role Ascending</button>
                                <button class="staff-list-sort-option" type="button" data-sort-label="Role Descending">Role Descending</button>
                                <button class="staff-list-sort-option" type="button" data-sort-label="Group by Role">Group by Role</button>
                            </div>
                        </div>
                    </div>

                    <div class="staff-list-card">
                        <h2 class="sr-only" id="staff-list-heading">Staff accounts list</h2>
                        <div class="staff-list-table-wrap">
                            <table class="staff-list-table">
                                <thead>
                                    <tr>
                                        <th>Dentist ID</th>
                                        <th>Display Name</th>
                                        <th>Role</th>
                                        <th>Controls</th>
                                    </tr>
                                </thead>
                                <tbody id="staff-list-table-body"></tbody>
                            </table>
                        </div>

                        <div class="staff-list-pagination" id="staff-list-pagination">
                            <button class="staff-list-page-nav" id="staff-list-prev-btn" type="button" aria-label="Previous page">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
                                    <path d="M36.6667 56.6667L20 40L36.6667 23.3333" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M60 56.6667L43.3333 40L60 23.3333" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            <div class="staff-list-page-buttons" id="staff-list-page-buttons"></div>
                            <button class="staff-list-page-nav" id="staff-list-next-btn" type="button" aria-label="Next page">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
                                    <path d="M43.3333 56.6667L60 40L43.3333 23.3333" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M20 56.6667L36.6667 40L20 23.3333" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </section>
            </main>
        </div>

        <script src="../JS/staff-list.js"></script>
    </body>
</html>
