        <div class="portrait-warning">

                <div class="Side-Nav-BTN active" id="AppointmentsPage-BTN">
                    <div class="SNB-Icon-Container">

                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Appointments</h1>
                    </div>
                </div>

                <!-- New Patient  [node 220:102] -->
                <div class="Side-Nav-BTN" id="NewPatientPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">

                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">New Patient</h1>
                    </div>
                </div>

                <!-- Staff  [node 239:3166] -->
                <div class="Side-Nav-BTN" id="StaffPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M33.3335 8.33331H37.5002C38.6052 8.33331 39.665 8.7723 40.4464 9.5537C41.2278 10.3351 41.6668 11.3949 41.6668 12.5V41.6666C41.6668 42.7717 41.2278 43.8315 40.4464 44.6129C39.665 45.3943 38.6052 45.8333 37.5002 45.8333H12.5002C11.3951 45.8333 10.3353 45.3943 9.55388 44.6129C8.77248 43.8315 8.3335 42.7717 8.3335 41.6666V12.5C8.3335 11.3949 8.77248 10.3351 9.55388 9.5537C10.3353 8.7723 11.3951 8.33331 12.5002 8.33331H16.6668" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

                    </div>

                        <h1 class="SNB-Label">Staff</h1>
                    </div>
                </div>

            </div><!-- /Side-Nav-Container -->

            <!-- Logout  [node 220:111] -->
            <div class="Logout-Container">
                <div class="Logout-BTN" id="Logout-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M39.5161 5.36706C45.8669 9.83134 50 17.1329 50 25.3968C50 38.9682 38.8306 49.9702 25.0504 49.9999C11.2903 50.0297 0.0201797 38.9881 1.83988e-05 25.4365C-0.0100622 17.1726 4.123 9.85118 10.4637 5.37698C11.6432 4.55357 13.2863 4.90079 13.9919 6.14087L15.5847 8.92856C16.1794 9.97023 15.8972 11.2897 14.9194 12.004C10.7359 15.0595 8.06453 19.9008 8.06453 25.3869C8.05445 34.5436 15.5746 42.0634 25 42.0634C34.2339 42.0634 41.996 34.7023 41.9355 25.2877C41.9052 20.1488 39.4456 15.1885 35.0706 11.994C34.0928 11.2797 33.8206 9.96031 34.4153 8.92856L36.0081 6.14087C36.7137 4.91071 38.3468 4.54365 39.5161 5.36706ZM29.0323 26.1904V2.38095C29.0323 1.06151 27.9536 0 26.6129 0H23.3871C22.0464 0 20.9678 1.06151 20.9678 2.38095V26.1904C20.9678 27.5099 22.0464 28.5714 23.3871 28.5714H26.6129C27.9536 28.5714 29.0323 27.5099 29.0323 26.1904Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="Logout-Label">Logout</h1>
                    </div>
                </div>
            </div>

        </div><!-- /SideBar -->


        <!-- ═══════════════════════════════════════
             MAIN VIEW
        ═══════════════════════════════════════ -->
        <div class="MainView">

            <!-- Top Bar -->
            <div class="TopBar">
                <div class="TopBar-Nav">
                    <h1 class="TopBar-Nav-Text">Appointments</h1>
                </div>
                <div class="UserContainer">
                    <div class="Username-Container">
                        <h1 class="Staff-Name" id="Staff-Name">Frostishyper</h1>
                        <h2 class="Staff-Role" id="Staff-Role">Dentist</h2>
                    </div>
                    <div class="PFP-Container">
                        <div class="PFP" id="Staff-PFP"></div>
                    </div>
                </div>
            </div>

            <!-- Main Activity -->
            <div class="MainActivity">

                <!-- ══════════════════════════════
                        APPOINTMENTS PANEL
                ══════════════════════════════ -->
                <div class="Appointments-Container">

                    <!-- Appointments Today -->
                    <div class="Appointments-Today">

                        <!-- Header row -->
                        <div class="Appointment-Header">
                            <div class="Appt-Label-Container">
                                <h2 class="Appt-Date-Label" id="appt-date-label">Today</h2>
                            </div>
                            <button class="New-Booking-BTN" id="new-booking-btn">
                                <span class="New-Booking-Text">New Booking</span>
                                <div class="New-Booking-Icon-Container">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                        <line x1="12" y1="5" x2="12" y2="19"/>
                                        <line x1="5" y1="12" x2="19" y2="12"/>
                                    </svg>
                                </div>
                            </button>
                        </div>

                        <!-- White card with entries -->
                        <div class="Appointment-Today-Container" id="appt-list">
                            <!-- Injected by JS -->
                        </div>

                    </div><!-- /Appointments-Today -->

                    <!-- Pagination -->
                    <div class="Appt-Pagination">
                        <button class="Pag-Arrow-BTN" id="pag-prev">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/>
                            </svg>
                        </button>
                        <div class="Pag-Page-Cell">
                            <span class="Pag-Info" id="pag-info">1 / 1</span>
                        </div>
                        <button class="Pag-Arrow-BTN" id="pag-next">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/>
                            </svg>
                        </button>
                    </div>

                </div><!-- /Appointments-Container -->


                <!-- ══════════════════════════════
                        CALENDAR PANEL
                ══════════════════════════════ -->
                <div class="Calendar-Container">

                    <!-- Branch Header -->
                    <div class="Cal-Branch-Header">
                        <div class="Cal-Branch-Label-Container">
                            <span class="Cal-Branch-Label" id="cal-branch-label">Branch</span>
                        </div>
                        <div class="Cal-Dropdown-Static Cal-Dropdown" id="cal-branch-dropdown" data-dropdown="branch">
                            <button class="Cal-Dropdown-Toggle" id="cal-branch-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="cal-branch-label cal-branch-display">
                                <span class="Cal-Dropdown-Value" id="cal-branch-display">Manila</span>
                                <div class="Cal-Dropdown-Arrow" aria-hidden="true">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                        <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                            </button>
                            <div class="Cal-Dropdown-Menu" id="cal-branch-menu" role="listbox" aria-label="Branch options" hidden></div>
                            <select class="Cal-Select" id="cal-branch-select" tabindex="-1" aria-hidden="true">
                                <option selected>Manila</option>
                                <option>Buendia</option>
                            </select>
                        </div>
                    </div>

                    <!-- Month / Year selects -->
                    <div class="Cal-Timeline-Container">
                        <div class="Cal-Dropdown-Select-Wrapper Cal-Dropdown" id="cal-month-dropdown" data-dropdown="month">
                            <button class="Cal-Dropdown-Toggle" id="cal-month-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Select month">
                                <span class="Cal-Dropdown-Value" id="cal-month-display">April</span>
                                <div class="Cal-Dropdown-Arrow" aria-hidden="true">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                        <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                            </button>
                            <div class="Cal-Dropdown-Menu" id="cal-month-menu" role="listbox" aria-label="Month options" hidden></div>
                            <select class="Cal-Select" id="cal-month-select" tabindex="-1" aria-hidden="true">
                                <option value="0">January</option>
                                <option value="1">February</option>
                                <option value="2">March</option>
                                <option value="3" selected>April</option>
                                <option value="4">May</option>
                                <option value="5">June</option>
                                <option value="6">July</option>
                                <option value="7">August</option>
                                <option value="8">September</option>
                                <option value="9">October</option>
                                <option value="10">November</option>
                                <option value="11">December</option>
                            </select>
                        </div>
                        <div class="Cal-Dropdown-Select-Wrapper Cal-Dropdown" id="cal-year-dropdown" data-dropdown="year">
                            <button class="Cal-Dropdown-Toggle" id="cal-year-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Select year">
                                <span class="Cal-Dropdown-Value" id="cal-year-display">2026</span>
                                <div class="Cal-Dropdown-Arrow" aria-hidden="true">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                        <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                            </button>
                            <div class="Cal-Dropdown-Menu" id="cal-year-menu" role="listbox" aria-label="Year options" hidden></div>
                            <select class="Cal-Select" id="cal-year-select" tabindex="-1" aria-hidden="true">
                                <!-- Populated by JS -->
                            </select>
                        </div>
                    </div>

                    <!-- Calendar Grid -->
                    <div class="Cal-Grid-Wrapper">
                        <!-- Day label row -->
                        <div class="Cal-Row" id="cal-day-labels">
                            <!-- Injected by JS -->
                        </div>
                        <!-- Date rows -->
                        <div class="Cal-Dates" id="cal-dates">
                            <!-- Injected by JS -->
                        </div>
                        <!-- Calendar Pagination (day navigator) -->
                        <div class="Cal-Pagination">
                            <button class="Cal-Pag-Arrow" id="cal-prev-day">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="11 17 6 12 11 7"/><polyline points="18 17 13 12 18 7"/>
                                </svg>
                            </button>
                            <div class="Cal-Pag-Center">
                                <div class="Cal-Day-Pill" id="cal-day-pill">6</div>
                            </div>
                            <button class="Cal-Pag-Arrow" id="cal-next-day">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                </div><!-- /Calendar-Container -->

            </div><!-- /MainActivity -->
        </div><!-- /MainView -->

        <script src="../JS/appointments.js"></script>
    </body>
</html>
