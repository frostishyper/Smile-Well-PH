<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register Staff - SmileWell Dental System</title>
        <link rel="stylesheet" href="../CSS/register-staff.css">
        <script src="../JS/logout.js"></script>
    </head>
    <body>
        <div class="portrait-warning">
            <h2>Please rotate your device</h2>
            <p>SmileWell Dental System requires landscape mode.</p>
        </div>

        <div class="SideBar">
            <div class="TopCorner">
                <div class="LogoContainer">
                    <h1 class="SmileWellLogo">
                        <span class="logo-light">Smile</span><span class="logo-dark">Well</span>
                        <br>
                        <span class="logo-light">Dental </span><span class="logo-dark">System</span>
                    </h1>
                </div>
            </div>

            <div class="Side-Nav-Container">
                <div class="Side-Nav-BTN" id="dashboardpage-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M20.8333 6.25H6.25V20.8333H20.8333V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M43.75 6.25H29.1667V20.8333H43.75V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M43.75 29.1667H29.1667V43.75H43.75V29.1667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20.8333 29.1667H6.25V43.75H20.8333V29.1667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Dashboard</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN" id="recordspage-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M43.75 16.6667V43.75H6.25V16.6667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M47.9167 6.25H2.08333V16.6667H47.9167V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20.8333 25H29.1667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Records</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN" id="appointmentspage-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M39.5833 8.33333H10.4167C8.11548 8.33333 6.25 10.1988 6.25 12.5V41.6667C6.25 43.9679 8.11548 45.8333 10.4167 45.8333H39.5833C41.8845 45.8333 43.75 43.9679 43.75 41.6667V12.5C43.75 10.1988 41.8845 8.33333 39.5833 8.33333Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M33.3333 4.16667V12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M16.6667 4.16667V12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M6.25 20.8333H43.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Appointments</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN" id="newpatientpage-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M33.3333 43.75V39.5833C33.3333 37.3732 32.4554 35.2536 30.8926 33.6908C29.3298 32.128 27.2101 31.25 25 31.25H10.4167C8.20653 31.25 6.08691 32.128 4.52411 33.6908C2.96131 35.2536 2.08333 37.3732 2.08333 39.5833V43.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M17.7083 22.9167C22.3107 22.9167 26.0417 19.1857 26.0417 14.5833C26.0417 9.98096 22.3107 6.25 17.7083 6.25C13.106 6.25 9.375 9.98096 9.375 14.5833C9.375 19.1857 13.106 22.9167 17.7083 22.9167Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M41.6667 16.6667V29.1667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M47.9167 22.9167H35.4167" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">New Patient</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN active" id="staffpage-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M33.3333 8.33333H37.5C38.6051 8.33333 39.6649 8.77232 40.4463 9.55372C41.2277 10.3351 41.6667 11.3949 41.6667 12.5V41.6667C41.6667 42.7717 41.2277 43.8315 40.4463 44.6129C39.6649 45.3943 38.6051 45.8333 37.5 45.8333H12.5C11.3949 45.8333 10.3351 45.3943 9.55372 44.6129C8.77232 43.8315 8.33333 42.7717 8.33333 41.6667V12.5C8.33333 11.3949 8.77232 10.3351 9.55372 9.55372C10.3351 8.77232 11.3949 8.33333 12.5 8.33333H16.6667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M31.25 4.16667H18.75C17.5994 4.16667 16.6667 5.09941 16.6667 6.25V10.4167C16.6667 11.5673 17.5994 12.5 18.75 12.5H31.25C32.4006 12.5 33.3333 11.5673 33.3333 10.4167V6.25C33.3333 5.09941 32.4006 4.16667 31.25 4.16667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Staff</h1>
                    </div>
                </div>
            </div>

            <div class="Logout-Container">
                <div class="Logout-BTN" id="logout-btn">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M39.5161 5.36706C45.8669 9.83134 50 17.1329 50 25.3968C50 38.9682 38.8306 49.9702 25.0504 49.9999C11.2903 50.0297 0.0201797 38.9881 1.83988e-05 25.4365C-0.0100622 17.1726 4.123 9.85118 10.4637 5.37698C11.6432 4.55357 13.2863 4.90079 13.9919 6.14087L15.5847 8.92856C16.1794 9.97023 15.8972 11.2897 14.9194 12.004C10.7359 15.0595 8.06453 19.9008 8.06453 25.3869C8.05445 34.5436 15.5746 42.0634 25 42.0634C34.2339 42.0634 41.996 34.7023 41.9355 25.2877C41.9052 20.1488 39.4456 15.1885 35.0706 11.994C34.0927 11.2797 33.8206 9.96031 34.4153 8.92856L36.0081 6.14087C36.7137 4.91071 38.3468 4.54365 39.5161 5.36706ZM29.0323 26.1904V2.38095C29.0323 1.06151 27.9536 0 26.6129 0H23.3871C22.0464 0 20.9678 1.06151 20.9678 2.38095V26.1904C20.9678 27.5099 22.0464 28.5714 23.3871 28.5714H26.6129C27.9536 28.5714 29.0323 27.5099 29.0323 26.1904Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="Logout-Label">Logout</h1>
                    </div>
                </div>
            </div>
        </div>

        <div class="MainView">
            <div class="TopBar">
                <div class="TopBar-Nav">
                    <h1 class="TopBar-Nav-Text">Staff &gt; Register Staff</h1>
                </div>
                <div class="UserContainer">
                    <div class="Username-Container">
                        <h1 class="Staff-Name" id="staff-name">Frostishyper</h1>
                        <h2 class="Staff-Role" id="staff-role">Dentist</h2>
                    </div>
                    <div class="PFP-Container">
                        <div class="PFP" id="staff-pfp"></div>
                    </div>
                </div>
            </div>

            <main class="MainActivity">
                <section class="register-staff-card" aria-labelledby="register-staff-heading">
                    <div class="register-staff-header">
                        <h2 class="register-staff-heading" id="register-staff-heading">New Staff</h2>
                    </div>

                    <form class="register-staff-form" id="register-staff-form" novalidate>
                        <div class="register-staff-row register-staff-row-three">
                            <div class="register-staff-col">
                                <label class="register-staff-label" for="first-name">First Name</label>
                                <input class="register-staff-input" id="first-name" name="first_name" type="text" placeholder="First Name" required autocomplete="given-name">
                            </div>
                            <div class="register-staff-col">
                                <label class="register-staff-label" for="middle-name">Middle Name</label>
                                <input class="register-staff-input" id="middle-name" name="middle_name" type="text" placeholder="Middle Name" required autocomplete="additional-name">
                            </div>
                            <div class="register-staff-col">
                                <label class="register-staff-label" for="last-name">Last Name</label>
                                <input class="register-staff-input" id="last-name" name="last_name" type="text" placeholder="Last Name" required autocomplete="family-name">
                            </div>
                        </div>

                        <div class="register-staff-row register-staff-row-three">
                            <div class="register-staff-col">
                                <label class="register-staff-label" for="phone-number">Contact #</label>
                                <input class="register-staff-input" id="phone-number" name="phone_number" type="tel" inputmode="numeric" maxlength="11" pattern="09[0-9]{9}" placeholder="09XXXXXXXXX" required>
                            </div>
                            <div class="register-staff-col">
                                <label class="register-staff-label" for="email-address">Email Address</label>
                                <input class="register-staff-input" id="email-address" name="email_address" type="email" placeholder="Email Address" required autocomplete="email">
                            </div>
                            <div class="register-staff-col">
                                <label class="register-staff-label" for="birthdate">
                                    Birthdate <span class="register-staff-label-note">(MM / DD / YYYY)</span>
                                </label>
                                <div class="register-staff-date-field" id="birthdate-field" tabindex="0" role="button" aria-label="Choose birthdate">
                                    <span class="register-staff-date-display is-placeholder" id="birthdate-display">MM / DD / YYYY</span>
                                    <input class="register-staff-date-input" id="birthdate" name="birthdate" type="date" required>
                                </div>
                            </div>
                        </div>

                        <div class="register-staff-row register-staff-row-mixed">
                            <div class="register-staff-col register-staff-col-select">
                                <label class="register-staff-label" id="sex-label" for="sex">Sex</label>
                                <div class="register-staff-dropdown" data-dropdown="sex">
                                    <button class="register-staff-dropdown-toggle" id="sex-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="sex-label sex-display">
                                        <span class="register-staff-dropdown-value is-placeholder" id="sex-display">Select</span>
                                        <div class="register-staff-dropdown-arrow" aria-hidden="true">
                                            <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </div>
                                    </button>
                                    <div class="register-staff-dropdown-menu" id="sex-menu" role="listbox" aria-label="Sex options" hidden>
                                        <button class="register-staff-dropdown-option" type="button" role="option" data-target="sex" data-value="male">Male</button>
                                        <button class="register-staff-dropdown-option" type="button" role="option" data-target="sex" data-value="female">Female</button>
                                    </div>
                                    <select class="register-staff-select-input" id="sex" name="sex" required tabindex="-1" aria-hidden="true">
                                        <option value="" selected disabled>Select</option>
                                        <option value="male">male</option>
                                        <option value="female">female</option>
                                    </select>
                                </div>
                            </div>
                            <div class="register-staff-col register-staff-col-select">
                                <label class="register-staff-label" id="role-label" for="role">Role</label>
                                <div class="register-staff-dropdown" data-dropdown="role">
                                    <button class="register-staff-dropdown-toggle" id="role-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="role-label role-display">
                                        <span class="register-staff-dropdown-value is-placeholder" id="role-display">Select</span>
                                        <div class="register-staff-dropdown-arrow" aria-hidden="true">
                                            <svg viewBox="0 0 50 50" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </div>
                                    </button>
                                    <div class="register-staff-dropdown-menu" id="role-menu" role="listbox" aria-label="Role options" hidden>
                                        <button class="register-staff-dropdown-option" type="button" role="option" data-target="role" data-value="dentist">Dentist</button>
                                        <button class="register-staff-dropdown-option" type="button" role="option" data-target="role" data-value="staff">Staff</button>
                                    </div>
                                    <select class="register-staff-select-input" id="role" name="role" required tabindex="-1" aria-hidden="true">
                                        <option value="" selected disabled>Select</option>
                                        <option value="dentist">dentist</option>
                                        <option value="staff">staff</option>
                                    </select>
                                </div>
                            </div>
                            <div class="register-staff-col register-staff-col-fill">
                                <label class="register-staff-label" for="display-name">Display Name</label>
                                <input class="register-staff-input" id="display-name" name="display_name" type="text" placeholder="Display Name" required autocomplete="nickname">
                            </div>
                        </div>

                        <div class="register-staff-row register-staff-row-two">
                            <div class="register-staff-col">
                                <label class="register-staff-label" for="password">Password</label>
                                <input class="register-staff-input" id="password" name="password" type="password" placeholder="Password" required autocomplete="new-password">
                            </div>
                            <div class="register-staff-col">
                                <label class="register-staff-label" for="confirm-password">Confirm Password</label>
                                <input class="register-staff-input" id="confirm-password" name="confirm_password" type="password" placeholder="Confirm Password" required autocomplete="new-password">
                            </div>
                        </div>

                        <div class="register-staff-row">
                            <div class="register-staff-col register-staff-col-full">
                                <label class="register-staff-label" for="home-address">Home Adress</label>
                                <input class="register-staff-input" id="home-address" name="home_address" type="text" placeholder="Home Adress" required autocomplete="street-address">
                            </div>
                        </div>

                        <div class="register-staff-submit-row">
                            <button class="register-staff-submit-btn" id="register-staff-submit-btn" type="submit">Register</button>
                        </div>
                    </form>
                </section>

                <div class="register-staff-modal-backdrop" id="register-staff-modal-backdrop" hidden>
                    <div class="register-staff-modal" id="register-staff-modal" role="dialog" aria-modal="true" aria-labelledby="register-staff-modal-title" aria-describedby="register-staff-modal-text">
                        <div class="register-staff-modal-icon-wrap" aria-hidden="true">
                            <div class="register-staff-modal-icon-tile">
                                <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M23.75 26.25H6.25C5.58696 26.25 4.95107 25.9866 4.48223 25.5178C4.01339 25.0489 3.75 24.413 3.75 23.75V6.25C3.75 5.58696 4.01339 4.95107 4.48223 4.48223C4.95107 4.01339 5.58696 3.75 6.25 3.75H20L26.25 10V23.75C26.25 24.413 25.9866 25.0489 25.5178 25.5178C25.0489 25.9866 24.413 26.25 23.75 26.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M21.25 26.25V16.25H8.75V26.25" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M8.75 3.75V10H18.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </div>
                        </div>
                        <div class="register-staff-modal-copy">
                            <h2 class="register-staff-modal-title" id="register-staff-modal-title">Register</h2>
                            <p class="register-staff-modal-text" id="register-staff-modal-text">Create New Staff</p>
                        </div>
                        <div class="register-staff-modal-actions">
                            <button class="register-staff-modal-confirm" id="register-staff-modal-confirm" type="button">Create</button>
                            <button class="register-staff-modal-cancel" id="register-staff-modal-cancel" type="button">Cancel</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>

        <script src="../JS/register-staff.js"></script>
    </body>
</html>
