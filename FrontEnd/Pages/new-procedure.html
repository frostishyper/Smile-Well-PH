<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>New Procedure - SmileWell Dental System</title>
        <link rel="stylesheet" href="../CSS/new-procedure.css">
    </head>

    <body>
        <div class="portrait-warning">
            <h2>Please rotate your device</h2>
            <p>SmileWell is optimized for landscape view.</p>
        </div>

        <div class="SideBar">
            <div class="TopCorner">
                <div class="LogoContainer">
                    <h1 class="SmileWellLogo">
                        <span class="logo-light">Smile</span><span class="logo-dark">Well</span>
                        <br>
                        <span class="logo-light">Dental </span><span class="logo-dark">System</span>
                    </h1>
                </div>
            </div>

            <div class="Side-Nav-Container">
                <div class="Side-Nav-BTN" id="DashboardPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M20.8333 6.25H6.25V20.8333H20.8333V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M43.7498 6.25H29.1665V20.8333H43.7498V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M43.7498 29.1667H29.1665V43.75H43.7498V29.1667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20.8333 29.1667H6.25V43.75H20.8333V29.1667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Dashboard</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN" id="RecordsPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M43.75 16.6667V43.75H6.25V16.6667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M47.9168 6.25H2.0835V16.6667H47.9168V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20.8335 25H29.1668" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Records</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN active" id="AppointmentsPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M39.5833 8.33331H10.4167C8.11548 8.33331 6.25 10.1988 6.25 12.5V41.6666C6.25 43.9678 8.11548 45.8333 10.4167 45.8333H39.5833C41.8845 45.8333 43.75 43.9678 43.75 41.6666V12.5C43.75 10.1988 41.8845 8.33331 39.5833 8.33331Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M33.3335 4.16669V12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M16.6665 4.16669V12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M6.25 20.8333H43.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Appointments</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN" id="NewPatientPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M33.3335 43.75V39.5833C33.3335 37.3732 32.4555 35.2536 30.8927 33.6908C29.3299 32.128 27.2103 31.25 25.0002 31.25H10.4168C8.20669 31.25 6.08708 32.128 4.52427 33.6908C2.96147 35.2536 2.0835 37.3732 2.0835 39.5833V43.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M17.7083 22.9167C22.3107 22.9167 26.0417 19.1857 26.0417 14.5833C26.0417 9.98096 22.3107 6.25 17.7083 6.25C13.106 6.25 9.375 9.98096 9.375 14.5833C9.375 19.1857 13.106 22.9167 17.7083 22.9167Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M41.6665 16.6667V29.1667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M47.9165 22.9167H35.4165" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">New Patient</h1>
                    </div>
                </div>

                <div class="Side-Nav-BTN" id="StaffPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M33.3335 8.33331H37.5002C38.6052 8.33331 39.665 8.7723 40.4464 9.5537C41.2278 10.3351 41.6668 11.3949 41.6668 12.5V41.6666C41.6668 42.7717 41.2278 43.8315 40.4464 44.6129C39.665 45.3943 38.6052 45.8333 37.5002 45.8333H12.5002C11.3951 45.8333 10.3353 45.3943 9.55388 44.6129C8.77248 43.8315 8.3335 42.7717 8.3335 41.6666V12.5C8.3335 11.3949 8.77248 10.3351 9.55388 9.5537C10.3353 8.7723 11.3951 8.33331 12.5002 8.33331H16.6668" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M31.2498 4.16669H18.7498C17.5992 4.16669 16.6665 5.09943 16.6665 6.25002V10.4167C16.6665 11.5673 17.5992 12.5 18.7498 12.5H31.2498C32.4004 12.5 33.3332 11.5673 33.3332 10.4167V6.25002C33.3332 5.09943 32.4004 4.16669 31.2498 4.16669Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Staff</h1>
                    </div>
                </div>
            </div>

            <div class="Logout-Container">
                <div class="Logout-BTN" id="Logout-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M39.5161 5.36706C45.8669 9.83134 50 17.1329 50 25.3968C50 38.9682 38.8306 49.9702 25.0504 49.9999C11.2903 50.0297 0.0201797 38.9881 1.83988e-05 25.4365C-0.0100622 17.1726 4.123 9.85118 10.4637 5.37698C11.6432 4.55357 13.2863 4.90079 13.9919 6.14087L15.5847 8.92856C16.1794 9.97023 15.8972 11.2897 14.9194 12.004C10.7359 15.0595 8.06453 19.9008 8.06453 25.3869C8.05445 34.5436 15.5746 42.0634 25 42.0634C34.2339 42.0634 41.996 34.7023 41.9355 25.2877C41.9052 20.1488 39.4456 15.1885 35.0706 11.994C34.0928 11.2797 33.8206 9.96031 34.4153 8.92856L36.0081 6.14087C36.7137 4.91071 38.3468 4.54365 39.5161 5.36706ZM29.0323 26.1904V2.38095C29.0323 1.06151 27.9536 0 26.6129 0H23.3871C22.0464 0 20.9678 1.06151 20.9678 2.38095V26.1904C20.9678 27.5099 22.0464 28.5714 23.3871 28.5714H26.6129C27.9536 28.5714 29.0323 27.5099 29.0323 26.1904Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="Logout-Label">Logout</h1>
                    </div>
                </div>
            </div>
        </div>

        <div class="MainView">
            <div class="TopBar">
                <div class="TopBar-Nav">
                    <h1 class="TopBar-Nav-Text">Appointments &gt; <strong>New Procedure</strong></h1>
                </div>
                <div class="UserContainer">
                    <div class="Username-Container">
                        <h1 class="Staff-Name" id="Staff-Name">Frostishyper</h1>
                        <h2 class="Staff-Role" id="Staff-Role">Dentist</h2>
                    </div>
                    <div class="PFP-Container">
                        <div class="PFP" id="Staff-PFP"></div>
                    </div>
                </div>
            </div>

            <div class="MainActivity">
                <div class="ProcedureMainContainer">
                    <section class="ProcedureMainContent">
                        <article class="Dentist-Notes-Card">
                            <h2 class="SectionTitle" id="dentist-notes-title">Dentist Note(s)</h2>
                            <div class="Profile-Field NotesField">
                                <textarea class="dentist-notes-input" id="dentist-notes-input" placeholder="Type here..."></textarea>
                            </div>
                        </article>

                        <article class="ProcedureDetailsCard">
                            <div class="ProcedureDetailsHeader">
                                <h2 class="SectionTitle" id="procedure-details-title">Procedure(s)</h2>
                            </div>

                            <div class="AppointmentEntryContainer">
                                <div class="Profile-Field ProcedureNameField">
                                    <input
                                        type="text"
                                        class="AppointmentTitleEntryInput"
                                        id="AppointmentTitleEntryInput"
                                        placeholder="Procedure 3"
                                    >
                                </div>

                                <div class="Profile-Field AmountField">
                                    <div class="PesoFrame" aria-hidden="true">
                                        <span class="Peso">&#8369;</span>
                                    </div>

                                    <input
                                        type="number"
                                        min="0"
                                        step="0.01"
                                        inputmode="decimal"
                                        class="AppointmentEntryInput"
                                        id="AppointmentEntryInput"
                                        placeholder="100.00"
                                    >
                                </div>

                                <button class="SaveEditBTN" id="SaveEditBTN" type="button" aria-label="Add procedure">
                                    <svg width="30" height="30" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                        <path d="M15 27.5C21.9036 27.5 27.5 21.9036 27.5 15C27.5 8.09644 21.9036 2.5 15 2.5C8.09644 2.5 2.5 8.09644 2.5 15C2.5 21.9036 8.09644 27.5 15 27.5Z" stroke="#67B07D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M15 10V20" stroke="#67B07D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                        <path d="M10 15H20" stroke="#67B07D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </button>
                            </div>

                            <div class="AppointmentsListEntryContainer" id="procedure-list"></div>
                        </article>
                    </section>

                    <aside class="ProcedureSidebarContainer">
                        <article class="PatientCard">
                            <div class="PatientCardInner">
                                <div class="PatientAvatar" aria-hidden="true"></div>
                                <div class="PatientInfo">
                                    <h2 class="PatientName" id="patient-name">Kasane Teto</h2>
                                    <p class="PatientRole">Patient</p>
                                </div>
                            </div>
                        </article>

                        <article class="ProcedureMetaCard">
                            <div class="MetaFieldGroup">
                                <label class="MetaLabel" id="attending-dentist-label">Attending Dentist</label>
                                <div class="appointment-dropdown" id="dentist-dropdown-wrapper" data-dropdown="dentist">
                                    <button class="appointment-dropdown-toggle" id="dentist-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="attending-dentist-label dentist-display">
                                        <span class="appointment-dropdown-value" id="dentist-display">Frostishyper</span>
                                        <span class="appointment-dropdown-arrow" aria-hidden="true">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                                <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <div class="appointment-dropdown-menu" id="dentist-menu" role="listbox" aria-label="Attending dentist options" hidden></div>
                                    <select class="appointment-select-input" id="attending-dentist" name="attendingDentist" tabindex="-1" aria-hidden="true">
                                        <option selected>Frostishyper</option>
                                        <option>Yeeard</option>
                                    </select>
                                </div>
                            </div>

                            <div class="MetaFieldGroup">
                                <label class="MetaLabel" id="branch-label">Branch</label>
                                <div class="appointment-dropdown" id="branch-dropdown-wrapper" data-dropdown="branch">
                                    <button class="appointment-dropdown-toggle" id="branch-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="branch-label branch-display">
                                        <span class="appointment-dropdown-value" id="branch-display">Manila</span>
                                        <span class="appointment-dropdown-arrow" aria-hidden="true">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                                <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <div class="appointment-dropdown-menu" id="branch-menu" role="listbox" aria-label="Branch options" hidden></div>
                                    <select class="appointment-select-input" id="branch-select" name="branch" tabindex="-1" aria-hidden="true">
                                        <option selected>Manila</option>
                                        <option>Buendia</option>
                                    </select>
                                </div>
                            </div>

                            <div class="MetaFieldGroup">
                                <label class="MetaLabel" for="visit-date">Date</label>
                                <div class="DateFieldShell" id="date-dropdown-wrapper">
                                    <input class="DateInput" id="visit-date" name="visitDate" type="date" value="2026-04-13">
                                    <span class="DateArrow" aria-hidden="true">
                                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                            <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </span>
                                </div>
                            </div>

                            <div class="MetaFieldGroup">
                                <label class="MetaLabel" id="start-time-label">Start Time</label>
                                <div class="appointment-dropdown" id="start-dropdown-wrapper" data-dropdown="startTime">
                                    <button class="appointment-dropdown-toggle" id="start-time-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="start-time-label start-time-display">
                                        <span class="appointment-dropdown-value" id="start-time-display">1:00 PM</span>
                                        <span class="appointment-dropdown-arrow" aria-hidden="true">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                                <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <div class="appointment-dropdown-menu" id="start-time-menu" role="listbox" aria-label="Start time options" hidden></div>
                                    <select class="appointment-select-input" id="start-time" name="startTime" tabindex="-1" aria-hidden="true">
                                        <option>8:00 AM</option>
                                        <option>8:30 AM</option>
                                        <option>9:00 AM</option>
                                        <option>9:30 AM</option>
                                        <option>10:00 AM</option>
                                        <option>10:30 AM</option>
                                        <option>11:00 AM</option>
                                        <option>11:30 AM</option>
                                        <option>12:00 PM</option>
                                        <option>12:30 PM</option>
                                        <option selected>1:00 PM</option>
                                        <option>1:30 PM</option>
                                        <option>2:00 PM</option>
                                        <option>2:30 PM</option>
                                        <option>3:00 PM</option>
                                        <option>3:30 PM</option>
                                        <option>4:00 PM</option>
                                    </select>
                                </div>
                            </div>

                            <div class="MetaFieldGroup">
                                <label class="MetaLabel" id="end-time-label">End Time</label>
                                <div class="appointment-dropdown" id="end-dropdown-wrapper" data-dropdown="endTime">
                                    <button class="appointment-dropdown-toggle" id="end-time-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="end-time-label end-time-display">
                                        <span class="appointment-dropdown-value" id="end-time-display">1:30 PM</span>
                                        <span class="appointment-dropdown-arrow" aria-hidden="true">
                                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                                <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </span>
                                    </button>
                                    <div class="appointment-dropdown-menu" id="end-time-menu" role="listbox" aria-label="End time options" hidden></div>
                                    <select class="appointment-select-input" id="end-time" name="endTime" tabindex="-1" aria-hidden="true">
                                        <option>8:30 AM</option>
                                        <option>9:00 AM</option>
                                        <option>9:30 AM</option>
                                        <option>10:00 AM</option>
                                        <option>10:30 AM</option>
                                        <option>11:00 AM</option>
                                        <option>11:30 AM</option>
                                        <option>12:00 PM</option>
                                        <option>12:30 PM</option>
                                        <option>1:00 PM</option>
                                        <option selected>1:30 PM</option>
                                        <option>2:00 PM</option>
                                        <option>2:30 PM</option>
                                        <option>3:00 PM</option>
                                        <option>3:30 PM</option>
                                        <option>4:00 PM</option>
                                        <option>4:30 PM</option>
                                    </select>
                                </div>
                            </div>
                        </article>

                        <button class="CreateVisitBTN" id="create-visit-btn" type="button">
                            <span class="CreateVisitIcon" aria-hidden="true">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none">
                                    <path d="M50 6.6665H23.3333C21.5652 6.6665 19.8695 7.36888 18.6193 8.61912C17.369 9.86937 16.6667 11.5651 16.6667 13.3332V66.6665C16.6667 68.4346 17.369 70.1303 18.6193 71.3806C19.8695 72.6308 21.5652 73.3332 23.3333 73.3332H56.6667C58.4348 73.3332 60.1305 72.6308 61.3807 71.3806C62.631 70.1303 63.3333 68.4346 63.3333 66.6665V19.9998L50 6.6665Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M50 6.6665V19.9998H63.3333" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M40 43.3332V59.9998" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M31.6667 51.6665H48.3333" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </span>
                            <span class="CreateVisitLabel">Create Visit</span>
                        </button>
                    </aside>
                </div>
            </div>
        </div>

        <script src="../JS/new-procedure.js"></script>
    </body>
</html>
