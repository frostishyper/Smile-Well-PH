<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edit Staff - SmileWell Dental System</title>
        <link rel="stylesheet" href="../CSS/edit-staff.css">
    </head>
    <body>
        <div class="SideBar">
        <div class="TopCorner">

                    <span class="logo-light">Smile</span><span class="logo-dark">Well</span>
                    <br>
                    <span class="logo-light">Dental </span><span class="logo-dark">System</span>
                </h1>
            </div>
        </div>
        <div class="Side-Nav-Container">
            <div class="Side-Nav-BTN" id="DashboardPage-BTN">

                    <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">

                        <path d="M20.8333 29.1667H6.25V43.75H20.8333V29.1667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="SNB-Label-Container">
                    <h1 class="SNB-Label">Dash Board</h1>

            </div>

            <div class="Side-Nav-BTN" id="RecordsPage-BTN">
                <div class="SNB-Icon-Container">
                    <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
                        <path d="M43.75 16.6667V43.75H6.25V16.6667" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

                    </svg>
                </div>
                <div class="SNB-Label-Container">
                    <h1 class="SNB-Label">Records</h1>
                </div>
            </div>

            <div class="Side-Nav-BTN" id="AppointmentsPage-BTN">
                <div class="SNB-Icon-Container">
                    <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
                        <path d="M39.5833 8.33331H10.4167C8.11548 8.33331 6.25 10.1988 6.25 12.5V41.6666C6.25 43.9678 8.11548 45.8333 10.4167 45.8333H39.5833C41.8845 45.8333 43.75 43.9678 43.75 41.6666V12.5C43.75 10.1988 41.8845 8.33331 39.5833 8.33331Z" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

                        <path d="M16.6665 4.16669V12.5" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M6.25 20.8333H43.75" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="SNB-Label-Container">
                    <h1 class="SNB-Label">Appointments</h1>
                </div>
            </div>

            <div class="Side-Nav-BTN" id="NewPatientPage-BTN">
                <div class="SNB-Icon-Container">
                    <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
                        <path d="M33.3335 43.75V39.5833C33.3335 37.3732 32.4555 35.2536 30.8927 33.6908C29.3299 32.128 27.2103 31.25 25.0002 31.25H10.4168C8.20669 31.25 6.08708 32.128 4.52427 33.6908C2.96147 35.2536 2.0835 37.3732 2.0835 39.5833V43.75" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M17.7083 22.9167C22.3107 22.9167 26.0417 19.1857 26.0417 14.5833C26.0417 9.98096 22.3107 6.25 17.7083 6.25C13.106 6.25 9.375 9.98096 9.375 14.5833C9.375 19.1857 13.106 22.9167 17.7083 22.9167Z" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M41.6665 16.6667V29.1667" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M47.9165 22.9167H35.4165" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="SNB-Label-Container">
                    <h1 class="SNB-Label">New Patient</h1>
                </div>
            </div>

            <div class="Side-Nav-BTN active" id="StaffPage-BTN">
                <div class="SNB-Icon-Container">
                    <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
                        <path d="M33.3335 8.33331H37.5002C38.6052 8.33331 39.665 8.77232 40.4464 9.55372C41.2278 10.3351 41.6668 11.3949 41.6668 12.5V41.6666C41.6668 42.7717 41.2278 43.8315 40.4464 44.6129C39.665 45.3943 38.6052 45.8333 37.5002 45.8333H12.5002C11.3951 45.8333 10.3353 45.3943 9.55388 44.6129C8.77248 43.8315 8.3335 42.7717 8.3335 41.6666V12.5C8.3335 11.3949 8.77248 10.3351 9.55388 9.55372C10.3353 8.77232 11.3951 8.33331 12.5002 8.33331H16.6668" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M31.2498 4.16669H18.7498C17.5992 4.16669 16.6665 5.09943 16.6665 6.25002V10.4167C16.6665 11.5673 17.5992 12.5 18.7498 12.5H31.2498C32.4004 12.5 33.3332 11.5673 33.3332 10.4167V6.25002C33.3332 5.09943 32.4004 4.16669 31.2498 4.16669Z" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <div class="SNB-Label-Container">
                    <h1 class="SNB-Label">Staff</h1>
                </div>
            </div>
        </div>

        <div class="Logout-Container">
            <div class="Logout-BTN" id="Logout-BTN">
                <div class="SNB-Icon-Container">
                    <svg xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 50 50" fill="none">
                        <path d="M39.5161 5.36706C45.8669 9.83134 50 17.1329 50 25.3968C50 38.9682 38.8306 49.9702 25.0504 49.9999C11.2903 50.0297 0.0201797 38.9881 1.83988e-05 25.4365C-0.0100622 17.1726 4.123 9.85118 10.4637 5.37698C11.6432 4.55357 13.2863 4.90079 13.9919 6.14087L15.5847 8.92856C16.1794 9.97023 15.8972 11.2897 14.9194 12.004C10.7359 15.0595 8.06453 19.9008 8.06453 25.3869C8.05445 34.5436 15.5746 42.0634 25 42.0634C34.2339 42.0634 41.996 34.7023 41.9355 25.2877C41.9052 20.1488 39.4456 15.1885 35.0706 11.994C34.0928 11.2797 33.8206 9.96031 34.4153 8.92856L36.0081 6.14087C36.7137 4.91071 38.3468 4.54365 39.5161 5.36706ZM29.0323 26.1904V2.38095C29.0323 1.06151 27.9536 0 26.6129 0H23.3871C22.0464 0 20.9678 1.06151 20.9678 2.38095V26.1904C20.9678 27.5099 22.0464 28.5714 23.3871 28.5714H26.6129C27.9536 28.5714 29.0323 27.5099 29.0323 26.1904Z" fill="black"/>
                    </svg>
                </div>
                <div class="SNB-Label-Container">
                    <h1 class="Logout-Label">Logout</h1> 
                </div>
            </div>
        </div>
        </div>

        <div class="MainView">
            <div class="TopBar">
                <div class="TopBar-Nav">
                    <h1 class="TopBar-Nav-Text">Staff &gt; Edit Staff</h1>
                </div>
                <div class="UserContainer">
                    <div class="Username-Container">
                        <h1 class="Staff-Name" id="staff-name">Frostishyper</h1>
                        <h2 class="Staff-Role" id="staff-role">Dentist</h2>
                    </div>
                    <div class="PFP-Container">
                        <div class="PFP" id="staff-pfp"></div>
                    </div>
                </div>
            </div>

            <main class="MainActivity">
                <section class="edit-staff-card" aria-labelledby="EditStaff-Heading">
                    <div class="edit-staff-header">
                        <h2 class="edit-staff-heading" id="EditStaff-Heading">Personnel Details</h2>

                        <div class="edit-staff-actions">
                            <button class="edit-staff-action-btn edit-staff-action-btn-reset" id="EditStaff-Reset-BTN" type="button" title="Restore original values">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M3 4V10H9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M21 20V14H15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M20.49 9C19.9828 7.56678 19.1209 6.2854 17.9852 5.27647C16.8495 4.26753 15.4777 3.56326 13.9972 3.22995C12.5167 2.89664 10.9755 2.94516 9.51847 3.37095C8.06141 3.79675 6.73698 4.58609 5.667 5.67L3 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M3.51 15C4.01717 16.4332 4.87913 17.7146 6.0148 18.7235C7.15047 19.7325 8.52234 20.4367 10.0028 20.77C11.4833 21.1034 13.0245 21.0548 14.4815 20.6291C15.9386 20.2033 17.263 19.4139 18.333 18.33L21 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>

                            <button class="edit-staff-action-btn edit-staff-action-btn-delete" id="EditStaff-Delete-BTN" type="button" title="Delete staff member">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M3 6H21" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M8 6V4H16V6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M19 6L18 20H6L5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M10 11V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M14 11V17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>

                            <button class="edit-staff-action-btn edit-staff-action-btn-save" id="EditStaff-Save-BTN" type="submit" form="EditStaff-Form" title="Save staff member">
                                <svg viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M23.75 26.25H6.25C5.58696 26.25 4.95107 25.9866 4.48223 25.5178C4.01339 25.0489 3.75 24.413 3.75 23.75V6.25C3.75 5.58696 4.01339 4.95107 4.48223 4.48223C4.95107 4.01339 5.58696 3.75 6.25 3.75H20L26.25 10V23.75C26.25 24.413 25.9866 25.0489 25.5178 25.5178C25.0489 25.9866 24.413 26.25 23.75 26.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M21.25 26.25V16.25H8.75V26.25" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                    <path d="M8.75 3.75V10H18.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <form class="edit-staff-form" id="EditStaff-Form" novalidate>
                        <div class="edit-staff-row edit-staff-row-three">
                            <div class="edit-staff-col">
                                <label class="edit-staff-label" for="FirstName-Input">First Name</label>
                                <input class="edit-staff-input" id="FirstName-Input" name="first_name" type="text" required>
                            </div>
                            <div class="edit-staff-col">
                                <label class="edit-staff-label" for="MiddleName-Input">Middle Name</label>
                                <input class="edit-staff-input" id="MiddleName-Input" name="middle_name" type="text" required>
                            </div>
                            <div class="edit-staff-col">
                                <label class="edit-staff-label" for="LastName-Input">Last Name</label>
                                <input class="edit-staff-input" id="LastName-Input" name="last_name" type="text" required>
                            </div>
                        </div>

                        <div class="edit-staff-row edit-staff-row-three">
                            <div class="edit-staff-col">
                                <label class="edit-staff-label" for="PhoneNumber-Input">Contact #</label>
                                <input class="edit-staff-input" id="PhoneNumber-Input" name="phone_number" type="tel" maxlength="11" required>
                            </div>
                            <div class="edit-staff-col">
                                <label class="edit-staff-label" for="EmailAddress-Input">Email Address</label>
                                <input class="edit-staff-input" id="EmailAddress-Input" name="email_address" type="email" required>
                            </div>
                            <div class="edit-staff-col">
                                <label class="edit-staff-label" for="Birthdate-Input">Birthdate</label>
                                <div class="edit-staff-date-field" id="Birthdate-Field" tabindex="0">
                                    <span class="edit-staff-date-display" id="Birthdate-Display">MM / DD / YYYY</span>
                                    <input class="edit-staff-date-input" id="Birthdate-Input" name="birthdate" type="date" required>
                                </div>
                            </div>
                        </div>

                        <div class="edit-staff-row edit-staff-row-mixed">
                            <div class="edit-staff-col edit-staff-col-select">
                                <label class="edit-staff-label" for="Sex-Select">Sex</label>
                                <div class="edit-staff-dropdown" data-dropdown="sex" id="Sex-Dropdown">
                                    <button class="edit-staff-dropdown-toggle" id="Sex-Toggle" type="button">
                                        <span class="edit-staff-dropdown-value" id="Sex-Display">Select</span>
                                    </button>
                                    <div class="edit-staff-dropdown-menu" id="Sex-Menu" hidden>
                                        <button class="edit-staff-dropdown-option" type="button" data-target="sex" data-value="male">Male</button>
                                        <button class="edit-staff-dropdown-option" type="button" data-target="sex" data-value="female">Female</button>
                                    </div>
                                    <select class="edit-staff-select-input" id="Sex-Select" name="sex" required tabindex="-1"></select>
                                </div>
                            </div>

                            <div class="edit-staff-col edit-staff-col-select">
                                <label class="edit-staff-label" for="Role-Select">Role</label>
                                <div class="edit-staff-dropdown" data-dropdown="role" id="Role-Dropdown">
                                    <button class="edit-staff-dropdown-toggle" id="Role-Toggle" type="button">
                                        <span class="edit-staff-dropdown-value" id="Role-Display">Select</span>
                                    </button>
                                    <div class="edit-staff-dropdown-menu" id="Role-Menu" hidden>
                                        <button class="edit-staff-dropdown-option" type="button" data-target="role" data-value="dentist">Dentist</button>
                                        <button class="edit-staff-dropdown-option" type="button" data-target="role" data-value="staff">Staff</button>
                                    </div>
                                    <select class="edit-staff-select-input" id="Role-Select" name="role" required tabindex="-1"></select>
                                </div>
                            </div>

                            <div class="edit-staff-col edit-staff-col-fill">
                                <label class="edit-staff-label" for="DisplayName-Input">Display Name</label>
                                <input class="edit-staff-input" id="DisplayName-Input" name="display_name" type="text" required>
                            </div>
                        </div>

                        <div class="edit-staff-row">
                            <div class="edit-staff-col edit-staff-col-full">
                                <label class="edit-staff-label" for="HomeAddress-Input">Home Address</label>
                                <input class="edit-staff-input" id="HomeAddress-Input" name="home_address" type="text" required>
                            </div>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </body>

            <script src="../JS/edit-staff.js"></script>
            <script src="../JS/logout.js"></script>
    <div class="portrait-warning">
        <h2>Please rotate your device</h2>
        <p>SmileWell Dental System requires landscape mode.</p>
    </div>
</html>
