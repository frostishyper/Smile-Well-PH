<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Edit Appointment - SmileWell Dental System</title>
        <link rel="stylesheet" href="../CSS/edit-appointment.css">
    </head>

    <body>

        <!-- Portrait Warning -->
        <div class="portrait-warning">
            <h2>Please rotate your device</h2>
            <p>SmileWell is optimized for landscape view.</p>
        </div>

        <!-- =====================================================
             SIDEBAR  [node 220:599]
             ===================================================== -->
        <div class="SideBar">

            <!-- Top Corner  [node 220:600] -->
            <div class="TopCorner">
                <div class="LogoContainer">
                    <h1 class="SmileWellLogo">
                        <span class="logo-light">Smile</span><span class="logo-dark">Well</span>
                        <br>
                        <span class="logo-light">Dental </span><span class="logo-dark">System</span>
                    </h1>
                </div>
            </div>

            <!-- Side Nav Container  [node 220:603] -->
            <div class="Side-Nav-Container">

                <!-- Dashboard  [node 220:604] -->
                <div class="Side-Nav-BTN" id="DashboardPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M20.8333 6.25H6.25V20.8333H20.8333V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M43.7498 6.25H29.1665V20.8333H43.7498V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M43.7498 29.1667H29.1665V43.75H43.7498V29.1667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20.8333 29.1667H6.25V43.75H20.8333V29.1667Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Dashboard</h1>
                    </div>
                </div>

                <!-- Records  [node 220:613] -->
                <div class="Side-Nav-BTN" id="RecordsPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M43.75 16.6667V43.75H6.25V16.6667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M47.9168 6.25H2.0835V16.6667H47.9168V6.25Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M20.8335 25H29.1668" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Records</h1>
                    </div>
                </div>

                <!-- Appointments — ACTIVE  [node 220:621] -->
                <div class="Side-Nav-BTN active" id="AppointmentsPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M39.5833 8.33331H10.4167C8.11548 8.33331 6.25 10.1988 6.25 12.5V41.6666C6.25 43.9678 8.11548 45.8333 10.4167 45.8333H39.5833C41.8845 45.8333 43.75 43.9678 43.75 41.6666V12.5C43.75 10.1988 41.8845 8.33331 39.5833 8.33331Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M33.3335 4.16669V12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M16.6665 4.16669V12.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M6.25 20.8333H43.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Appointments</h1>
                    </div>
                </div>

                <!-- New Patient  [node 220:630] -->
                <div class="Side-Nav-BTN" id="NewPatientPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M33.3335 43.75V39.5833C33.3335 37.3732 32.4555 35.2536 30.8927 33.6908C29.3299 32.128 27.2103 31.25 25.0002 31.25H10.4168C8.20669 31.25 6.08708 32.128 4.52427 33.6908C2.96147 35.2536 2.0835 37.3732 2.0835 39.5833V43.75" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M17.7083 22.9167C22.3107 22.9167 26.0417 19.1857 26.0417 14.5833C26.0417 9.98096 22.3107 6.25 17.7083 6.25C13.106 6.25 9.375 9.98096 9.375 14.5833C9.375 19.1857 13.106 22.9167 17.7083 22.9167Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M41.6665 16.6667V29.1667" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M47.9165 22.9167H35.4165" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">New Patient</h1>
                    </div>
                </div>

                <!-- Staff  [node 239:3158] -->
                <div class="Side-Nav-BTN" id="StaffPage-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M33.3335 8.33331H37.5002C38.6052 8.33331 39.665 8.7723 40.4464 9.5537C41.2278 10.3351 41.6668 11.3949 41.6668 12.5V41.6666C41.6668 42.7717 41.2278 43.8315 40.4464 44.6129C39.665 45.3943 38.6052 45.8333 37.5002 45.8333H12.5002C11.3951 45.8333 10.3353 45.3943 9.55388 44.6129C8.77248 43.8315 8.3335 42.7717 8.3335 41.6666V12.5C8.3335 11.3949 8.77248 10.3351 9.55388 9.5537C10.3353 8.7723 11.3951 8.33331 12.5002 8.33331H16.6668" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M31.2498 4.16669H18.7498C17.5992 4.16669 16.6665 5.09943 16.6665 6.25002V10.4167C16.6665 11.5673 17.5992 12.5 18.7498 12.5H31.2498C32.4004 12.5 33.3332 11.5673 33.3332 10.4167V6.25002C33.3332 5.09943 32.4004 4.16669 31.2498 4.16669Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="SNB-Label">Staff</h1>
                    </div>
                </div>

            </div><!-- /Side-Nav-Container -->

            <!-- Logout  [node 220:639] -->
            <div class="Logout-Container">
                <div class="Logout-BTN" id="Logout-BTN">
                    <div class="SNB-Icon-Container">
                        <svg class="Nav-Icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                            <path d="M39.5161 5.36706C45.8669 9.83134 50 17.1329 50 25.3968C50 38.9682 38.8306 49.9702 25.0504 49.9999C11.2903 50.0297 0.0201797 38.9881 1.83988e-05 25.4365C-0.0100622 17.1726 4.123 9.85118 10.4637 5.37698C11.6432 4.55357 13.2863 4.90079 13.9919 6.14087L15.5847 8.92856C16.1794 9.97023 15.8972 11.2897 14.9194 12.004C10.7359 15.0595 8.06453 19.9008 8.06453 25.3869C8.05445 34.5436 15.5746 42.0634 25 42.0634C34.2339 42.0634 41.996 34.7023 41.9355 25.2877C41.9052 20.1488 39.4456 15.1885 35.0706 11.994C34.0928 11.2797 33.8206 9.96031 34.4153 8.92856L36.0081 6.14087C36.7137 4.91071 38.3468 4.54365 39.5161 5.36706ZM29.0323 26.1904V2.38095C29.0323 1.06151 27.9536 0 26.6129 0H23.3871C22.0464 0 20.9678 1.06151 20.9678 2.38095V26.1904C20.9678 27.5099 22.0464 28.5714 23.3871 28.5714H26.6129C27.9536 28.5714 29.0323 27.5099 29.0323 26.1904Z" fill="currentColor"/>
                        </svg>
                    </div>
                    <div class="SNB-Label-Container">
                        <h1 class="Logout-Label">Logout</h1>
                    </div>
                </div>
            </div>

        </div><!-- /SideBar -->


        <!-- =====================================================
             MAIN VIEW  [node 220:646]
             ===================================================== -->
        <div class="MainView">

            <!-- Top Bar  [node 220:647] -->
            <div class="TopBar">
                <div class="TopBar-Nav">
                    <!-- Breadcrumb  [node 220:649]
                         "Appointments > Appointment #67" — number injected by JS -->
                    <h1 class="TopBar-Nav-Text">
                        Appointments &gt; <strong id="breadcrumb-appt">Appointment #—</strong>
                    </h1>
                </div>
                <div class="UserContainer">
                    <div class="Username-Container">
                        <h1 class="Staff-Name" id="Staff-Name">Frostishyper</h1>
                        <h2 class="Staff-Role" id="Staff-Role">Dentist</h2>
                    </div>
                    <div class="PFP-Container">
                        <div class="PFP" id="Staff-PFP"></div>
                    </div>
                </div>
            </div><!-- /TopBar -->

            <!-- Main Activity  [node 220:656] -->
            <div class="MainActivity">

                <!-- Edit Appointment Card — white card  [node 220:657] -->
                <div class="NewAppointment-Card">

                    <!-- Appointment Entry — summary header  [node 220:658] -->
                    <div class="Appointment-Entry">

                        <!-- Color Stub  [node 220:659] -->
                        <div class="Appt-Color-Stub" id="appt-color-stub"></div>

                        <!-- Appointment Details  [node 220:660] -->
                        <div class="Appt-Details">
                            <span class="Appt-Procedure" id="summary-procedure">Tooth Removal</span>
                            <span class="Appt-Patient"   id="summary-patient">Jared Ocampo</span>
                            <span class="Appt-Time"      id="summary-time">1:00 PM - 1:30 PM</span>
                        </div>

                        <!-- Appointment Control  [node 220:664] — 3 buttons -->
                        <div class="Appointment-Control">

                            <!-- Back/Return Btn  [node 220:665]
                                 border:#959595  no bg fill  w:84px  corner-down-left icon -->
                            <button class="Appt-Action-BTN Appt-BTN-Back" id="back-btn" type="button" title="Back to Appointments">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="9 10 4 15 9 20"/>
                                    <path d="M20 4v7a4 4 0 0 1-4 4H4"/>
                                </svg>
                            </button>

                            <!-- Cancel/Delete Btn  [node 220:670]
                                 bg:#f6b9b9  border:#be3a3a  trash icon -->
                            <button class="Appt-Action-BTN Appt-BTN-Cancel" id="cancel-btn" type="button" title="Delete Appointment">
                                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M3 6h18"/>
                                    <path d="M8 6V4h8v2"/>
                                    <path d="M19 6l-1 14H6L5 6"/>
                                    <path d="M10 11v6M14 11v6"/>
                                </svg>
                            </button>

                            <!-- Save Btn  [node 220:677]
                                 bg:#e8f7e0  border:#67b07d  save icon -->
                            <button class="Appt-Action-BTN Appt-BTN-Save" id="save-btn" type="button" title="Save Changes" aria-label="Save Changes">
                                <svg class="Appt-BTN-Icon" viewBox="0 0 30 30" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M23.75 26.25H6.25C5.58696 26.25 4.95107 25.9866 4.48223 25.5178C4.01339 25.0489 3.75 24.413 3.75 23.75V6.25C3.75 5.58696 4.01339 4.95107 4.48223 4.48223C4.95107 4.01339 5.58696 3.75 6.25 3.75H20L26.25 10V23.75C26.25 24.413 25.9866 25.0489 25.5178 25.5178C25.0489 25.9866 24.413 26.25 23.75 26.25Z"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"/>
                                    <path d="M21.25 26.25V16.25H8.75V26.25"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"/>
                                    <path d="M8.75 3.75V10H18.75"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div><!-- /Appointment-Control -->
                    </div><!-- /Appointment-Entry -->

                    <!-- Profile Fields Container  [node 220:683] -->
                    <div class="Profile-Fields-Container">

                        <!-- Patient Name  [node 220:684] -->
                        <div class="Profile-Field-Row">
                            <div class="Profile-Field-Col">
                                <label class="Form-Label" for="patient-name">Patient Name</label>
                                <div class="Profile-Field">
                                    <input class="Form-Input" id="patient-name" name="patientName" type="text" placeholder="e.g. Jared Ocampo">
                                </div>
                            </div>
                        </div>

                        <!-- Contact #  [node 220:690] -->
                        <div class="Profile-Field-Row">
                            <div class="Profile-Field-Col">
                                <label class="Form-Label" for="contact-number">Contact #</label>
                                <div class="Profile-Field">
                                    <input class="Form-Input" id="contact-number" name="contactNumber" type="text" placeholder="e.g. 0912345678">
                                </div>
                            </div>
                        </div>

                        <!-- Reason  [node 220:696] -->
                        <div class="Profile-Field-Row">
                            <div class="Profile-Field-Col">
                                <label class="Form-Label" for="appointment-reason">Reason</label>
                                <div class="Profile-Field">
                                    <input class="Form-Input" id="appointment-reason" name="reason" type="text" placeholder="e.g. Tooth Removal">
                                </div>
                            </div>
                        </div>

                        <!-- Time Row  [node 220:702] -->
                        <div class="Time-Row">

                            <!-- Date Label  [node 220:515] -->
                            <div class="Time-Label-Container">
                                <label class="Time-Label" for="appointment-date">Date</label>
                            </div>

                            <div class="Time-Dropdown" id="date-dropdown-wrapper" tabindex="0" role="button" aria-label="Choose appointment date">
                                <span class="Time-Display-Text" id="date-display">04/11/2026</span>

                                <input
                                    class="Date-Input"
                                    id="appointment-date"
                                    name="appointmentDate"
                                    type="date"
                                    value="2026-04-11"
                                >

                                <div class="Time-Arrow">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                        <path d="M12 18L25 31L38 18"
                                            stroke="currentColor"
                                            stroke-width="3"
                                            stroke-linecap="round"
                                            stroke-linejoin="round" />
                                    </svg>
                                </div>
                            </div>
                            

                            <!-- Start Label  [node 220:703] -->
                            <div class="Time-Label-Container">
                                <label class="Time-Label" for="start-time">Start</label>
                            </div>

                            <!-- Start Dropdown  [node 220:705] -->
                            <div class="Time-Dropdown" id="start-dropdown-wrapper">
                                <span class="Time-Display-Text" id="start-display">1:00</span>
                                <select class="Time-Select" id="start-time" name="startTime">
                                    <option>8:00 AM</option>  <option>8:30 AM</option>
                                    <option>9:00 AM</option>  <option>9:30 AM</option>
                                    <option>10:00 AM</option> <option>10:30 AM</option>
                                    <option>11:00 AM</option> <option>11:30 AM</option>
                                    <option>12:00 PM</option> <option>12:30 PM</option>
                                    <option>1:00 PM</option>  <option>1:30 PM</option>
                                    <option>2:00 PM</option>  <option>2:30 PM</option>
                                    <option>3:00 PM</option>  <option>3:30 PM</option>
                                    <option>4:00 PM</option>  <option>4:30 PM</option>
                                    <option>5:00 PM</option>
                                </select>
                                <div class="Time-Arrow">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                        <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                            </div>

                            <!-- End Label  [node 220:711] -->
                            <div class="Time-Label-Container">
                                <label class="Time-Label" for="end-time">End</label>
                            </div>

                            <!-- End Dropdown  [node 220:713] -->
                            <div class="Time-Dropdown" id="end-dropdown-wrapper">
                                <span class="Time-Display-Text" id="end-display">1:30</span>
                                <select class="Time-Select" id="end-time" name="endTime">
                                    <option>8:30 AM</option>  <option>9:00 AM</option>
                                    <option>9:30 AM</option>  <option>10:00 AM</option>
                                    <option>10:30 AM</option> <option>11:00 AM</option>
                                    <option>11:30 AM</option> <option>12:00 PM</option>
                                    <option>12:30 PM</option> <option>1:00 PM</option>
                                    <option>1:30 PM</option>  <option>2:00 PM</option>
                                    <option>2:30 PM</option>  <option>3:00 PM</option>
                                    <option>3:30 PM</option>  <option>4:00 PM</option>
                                    <option>4:30 PM</option>  <option>5:00 PM</option>
                                    <option>5:30 PM</option>
                                </select>
                                <div class="Time-Arrow">
                                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" fill="none">
                                        <path d="M12 18L25 31L38 18" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                                    </svg>
                                </div>
                            </div>

                        </div><!-- /Time-Row -->

                    </div><!-- /Profile-Fields-Container -->

                </div><!-- /NewAppointment-Card -->

            </div><!-- /MainActivity -->

        </div><!-- /MainView -->

        <script src="../JS/edit-appointment.js"></script>
    </body>
</html>
