<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title th:text="${appName}">Booking App</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>
<body>

    <header>
        <h1 th:text="${appName}">Booking App</h1>
        <p class="tagline">Biconditional Scheduling System</p>
    </header>

    <main>
        <div class="status-card">
            <span class="dot"></span>
            <p th:text="${status}">Server is running</p>
        </div>

        <section class="info">
            <h2>Server Info</h2>
            <ul>
                <li><strong>Port:</strong> 8080</li>
                <li><strong>Health:</strong> <a href="/actuator/health">/actuator/health</a></li>
                <li><strong>Ping:</strong> <a href="/ping">/ping</a></li>
            </ul>
        </section>
    </main>

    <footer>
        <p>Booking App &mdash; Base Server v0.0.1</p>
    </footer>

</body>
</html>
